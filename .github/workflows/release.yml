name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild and attach
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Create release
        uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  build:
    needs: release
    if: >-
      always() &&
      (needs.release.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.release.outputs.tag_name }}

      - name: Verify manual release version
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "${{ inputs.tag }}"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Build and package binaries
        shell: bash
        run: |
          mkdir -p dist/linux-x64 dist/linux-arm64 dist/windows-x64 dist/darwin-arm64 dist/darwin-x64 dist/out

          bun build --compile --target=bun-linux-x64 src/index.ts --outfile dist/linux-x64/9router-quota-server
          bun build --compile --target=bun-linux-arm64 src/index.ts --outfile dist/linux-arm64/9router-quota-server
          bun build --compile --target=bun-windows-x64 src/index.ts --outfile dist/windows-x64/9router-quota-server.exe
          bun build --compile --target=bun-darwin-arm64 src/index.ts --outfile dist/darwin-arm64/9router-quota-server
          bun build --compile --target=bun-darwin-x64 src/index.ts --outfile dist/darwin-x64/9router-quota-server

          tar -czf dist/out/9router-quota-server-linux-x64.tar.gz -C dist/linux-x64 9router-quota-server
          tar -czf dist/out/9router-quota-server-linux-arm64.tar.gz -C dist/linux-arm64 9router-quota-server
          (cd dist/windows-x64 && zip ../out/9router-quota-server-windows-x64.zip 9router-quota-server.exe)
          tar -czf dist/out/9router-quota-server-darwin-arm64.tar.gz -C dist/darwin-arm64 9router-quota-server
          tar -czf dist/out/9router-quota-server-darwin-x64.tar.gz -C dist/darwin-x64 9router-quota-server

          cd dist/out
          sha256sum * > SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 9router-quota-server-${{ needs.release.outputs.tag_name || inputs.tag }}
          path: |
            dist/out/*.tar.gz
            dist/out/*.zip
            dist/out/SHA256SUMS.txt
          if-no-files-found: error

      - name: Attach artifacts to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag_name || inputs.tag }}
          files: |
            dist/out/*.tar.gz
            dist/out/*.zip
            dist/out/SHA256SUMS.txt
          fail_on_unmatched_files: true
